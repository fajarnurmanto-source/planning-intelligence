name: PI VS4 operational continuity
on:
  pull_request:
    paths:
      - 'backend/app/vs4/**'
      - 'backend/tests/**'
      - 'backend/requirements-vs4.txt'
      - 'scripts/start_pi_vs4_demo.py'
      - '.github/workflows/pi-vs4-operational-continuity.yml'
  workflow_dispatch:
jobs:
  continuity-acceptance:
    name: VS4 operational continuity / product acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ready-made stack and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-vs4.txt
      - name: Verify VS1–VS4 end-to-end regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            backend/tests/test_coherence_vs1.py \
            backend/tests/test_review_vs2.py \
            backend/tests/test_canonical_review_vs3.py \
            backend/tests/test_operational_continuity_vs4.py
