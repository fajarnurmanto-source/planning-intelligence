name: PI M2 reproducible validation

on:
  pull_request:
    paths:
      - "backend/app/planning_entities/**"
      - "backend/tests/test_performance_taxonomy.py"
      - "backend/tests/test_planning_entities_m2.py"
      - "backend/tests/test_planning_pipeline_m2.py"
      - "backend/tests/test_m2_vs4_bridge_rs2.py tests/test_performance_taxonomy.py"
      - "frontend/**"
      - ".github/workflows/pi-m2-reproducible-ci.yml"
  workflow_dispatch:

jobs:
  m2-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing PI dependencies
        run: |
          python -m pip install -r backend/requirements-vs4.txt

      - name: Run existing M2 tests
        working-directory: backend
        run: |
          python -m pytest -q tests/test_planning_entities_m2.py tests/test_planning_pipeline_m2.py tests/test_m2_vs4_bridge_rs2.py

      - name: Verify cross-process determinism
        working-directory: backend
        shell: bash
        run: |
          code='from app.planning_entities.synthetic_demo import cached_synthetic_result; r=cached_synthetic_result(); print(r["report_sha256"])'
          first=$(python -c "$code")
          second=$(python -c "$code")
          test -n "$first"
          test "$first" = "$second"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible install
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build
