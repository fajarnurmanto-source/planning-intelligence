name: PI Substantive Planning Graph G2
on:
  pull_request:
    paths:
      - 'backend/app/graph_g2/**'
      - 'backend/app/vs4/reviewer_ui.py'
      - 'backend/tests/test_substantive_graph_g2.py'
      - 'backend/requirements-graph-g2.txt'
      - '.github/workflows/pi-planning-graph-g2.yml'
  push:
    paths:
      - 'backend/app/graph_g2/**'
      - 'backend/app/vs4/reviewer_ui.py'
      - 'backend/tests/test_substantive_graph_g2.py'
      - 'backend/requirements-graph-g2.txt'
      - '.github/workflows/pi-planning-graph-g2.yml'
permissions:
  contents: read
jobs:
  substantive-graph-g2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mature existing dependencies
        run: python -m pip install -r backend/requirements-graph-g2.txt
      - name: Complete VS1–VS5, G1, G2 regression
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_coherence_vs1.py \
            tests/test_review_vs2.py \
            tests/test_canonical_review_vs3.py \
            tests/test_operational_continuity_vs4.py \
            tests/test_browser_intake_vs5.py \
            tests/test_planning_graph_g1.py \
            tests/test_substantive_graph_g2.py
