             $audit -notcontains 'PI_R90_CODE_CUTOVER=HOLD_PENDING_ISOLATED_ACCEPTANCE' -or
             $audit -notcontains 'PI_R90_LOCK_BYTE_DRIFT_WITH_SAME_PACKAGE_IDENTITIES=YES') {
            throw 'PI_R90_DRIFT_FIXTURE_NOT_COMPLETE'
          }
          if($audit -notcontains 'PI_R90_HTACCESS_CLASSIFICATION=LINE_ENDING_ONLY') {
            throw 'PI_R90_HTACCESS_TEXT_CRLF_NOT_CLASSIFIED'
          }
          foreach($needle in @('PI_R90_DRIFT_RUNTIME_LINE_ENDING_ONLY=',
              'PI_R90_DRIFT_MIGRATION_LINE_ENDING_ONLY=',
              'PI_R90_DRIFT_MIGRATION_TEXT_CONTENT_DIFFERENT=')) {
            $values=@($audit | Where-Object {$_ -like ($needle+'*')})
            if($values.Count -ne 1 -or [int]($values[0].Split('=')[1]) -lt 1) {
              throw ('PI_R90_DRIFT_FIXTURE_CLASSIFICATION_NOT_PROVEN='+$needle)
            }
          }
          if($audit -notcontains 'PI_R90_LOCK_VERSION_CHANGED_COUNT=0' -or
             $audit -notcontains 'PI_R90_LOCK_ADDED=0' -or
             $audit -notcontains 'PI_R90_LOCK_REMOVED=0') {
            throw 'PI_R90_DRIFT_FIXTURE_LOCK_PACKAGE_IDS_CHANGED'
          }
          foreach($rel in $guarded) {
            if((Get-FileHash (Join-Path $app $rel) -Algorithm SHA256).Hash -ne $originals[$rel]) {
              throw ('PI_R90_DRIFT_FIXTURE_MUTATED='+$rel)
            }
          }
