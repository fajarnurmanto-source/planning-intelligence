              HtmlBlob=$htmlBlob; JsBlob=$jsBlob;
              HtmlBefore=(Get-FileHash -LiteralPath $html -Algorithm SHA256).Hash;
              JsBefore=(Get-FileHash -LiteralPath $js -Algorithm SHA256).Hash;
