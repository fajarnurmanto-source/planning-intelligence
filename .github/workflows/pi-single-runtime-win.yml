          New-Item -ItemType Directory -Path $app -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $app 'artisan'),'ci-only-artisan')
          $lock=Join-Path $app 'composer.lock'
          Copy-Item 'laravel/composer.lock' $lock
          [IO.File]::AppendAllText($lock,[Environment]::NewLine)
          $sourceRuntime='laravel/app/Models/User.php'
          $sourceHtaccess='laravel/public/.htaccess'
          $sourceMig='laravel/database/migrations/0001_01_01_000000_create_users_table.php'
          $sourceMig2='laravel/database/migrations/0001_01_01_000001_create_cache_table.php'
          foreach($p in @($sourceRuntime,$sourceMig,$sourceMig2,$sourceHtaccess)){
            if(-not (Test-Path -LiteralPath $p -PathType Leaf)){
              throw ('PI_R90_DRIFT_FIXTURE_SOURCE_MISSING='+$p)
            }
            $relative=$p.Substring(8).Replace([char]47,[char]92)
            $destination=Join-Path $app $relative
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            $text=[IO.File]::ReadAllText((Resolve-Path $p))
            if($p -eq $sourceMig2) {
              $text=$text+[Environment]::NewLine+'// CI synthetic migration source difference'
            } elseif($text.Contains([string][char]13+[string][char]10)) {
              $text=$text.Replace(([string][char]13+[string][char]10),([string][char]10))
            } else {
              $text=$text.Replace(([string][char]10),([string][char]13+[string][char]10))
            }
            [IO.File]::WriteAllText($destination,$text,[System.Text.UTF8Encoding]::new($false))
          }
          $guarded=@('artisan','composer.lock','app\Models\User.php','public\.htaccess',
            'database\migrations\0001_01_01_000000_create_users_table.php',
            'database\migrations\0001_01_01_000001_create_cache_table.php')
