name: PI existing unified launcher audit safety
on:
  pull_request:
    paths:
      - 'scripts/pi-audit-existing-launcher.ps1'
      - 'scripts/pi-r74-ensure-runtime.ps1'
      - 'scripts/pi-r74-inplace-upgrade.ps1'
      - 'scripts/pi-r74-windows-acceptance.ps1'
      - 'scripts/pi-r74-release-parity-readonly.ps1'
      - 'scripts/pi-r90-cutover-risk-readonly.ps1'
      - 'scripts/pi-r90-drift-classifier-readonly.ps1'
      - 'scripts/pi-r74-verify-backup.ps1'
      - 'scripts/pi-r74-auth-runtime-diagnostic.ps1'
      - 'scripts/pi-r74-auth-db-readonly.php'
      - 'scripts/pi-r74-verify-entered-password.php'
      - 'scripts/pi-r74-credential-parity-local.ps1'
      - 'scripts/pi-r74-http-auth-parity.ps1'
      - 'scripts/pi-r74-login-frontend-rollout.ps1'
      - 'laravel/public/login.html'
      - 'laravel/public/login.js'
      - 'scripts/windows/r74/**'
      - 'docs/PI_R74_ONE_ORIGIN_RUNTIME_ADAPTER_20261122.md'
      - 'docs/PI_SINGLE_RUNTIME_MANDATE_20261122.md'
      - '.github/workflows/pi-single-runtime-win.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-audit-existing-launcher.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_EXISTING_LAUNCHER_AUDIT_PARSE_FAILURE'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-ensure-runtime.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_RUNTIME_ADAPTER_PARSE_FAILURE'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-inplace-upgrade.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_INPLACE_UPGRADE_PARSE_FAILURE'
          }
          Write-Host 'PI_EXISTING_LAUNCHER_AUDIT_PARSE=PASS'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-windows-acceptance.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_ACCEPTANCE_PARSE_FAILURE'
          }
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-release-parity-readonly.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_RELEASE_PARITY_PS51_PARSE_FAILURE'
          }
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r90-cutover-risk-readonly.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R90_CUTOVER_RISK_PS51_PARSE_FAILURE'
          }
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r90-drift-classifier-readonly.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R90_DRIFT_CLASSIFIER_PS51_PARSE_FAILURE'
          }
          Write-Host 'PI_R90_DRIFT_CLASSIFIER_PS51_PARSE=PASS'
          Write-Host 'PI_R90_CUTOVER_RISK_PS51_PARSE=PASS'
          Write-Host 'PI_R74_RELEASE_PARITY_PS51_PARSE=PASS'
          Write-Host 'PI_R74_INPLACE_UPGRADE_PARSE=PASS'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-verify-backup.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_BACKUP_VERIFIER_PARSE_FAILURE'
          }
          Write-Host 'PI_R74_BACKUP_VERIFIER_PARSE=PASS'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-auth-runtime-diagnostic.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_AUTH_DIAGNOSTIC_PARSE_FAILURE'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-credential-parity-local.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_CREDENTIAL_PARITY_PS51_PARSE_FAILURE'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-http-auth-parity.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_HTTP_AUTH_PARITY_PARSE_FAILURE'
          }
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-login-frontend-rollout.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_FRONTEND_ROLLOUT_PS51_PARSE_FAILURE'
          }
          Write-Host 'PI_R74_FRONTEND_ROLLOUT_PS51_PARSE=PASS'
          Write-Host 'PI_R74_HTTP_AUTH_PARITY_PARSE=PASS'
          Write-Host 'PI_R74_CREDENTIAL_PARITY_PS51_PARSE=PASS'
          Write-Host 'PI_R74_AUTH_DIAGNOSTIC_PARSE=PASS'
          Write-Host 'PI_R74_ACCEPTANCE_PARSE=PASS'
      - name: Run read-only inventory on clean runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\pi-audit-existing-launcher.ps1'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw 'PI_AUDITOR_EXECUTION_FAILED'
          }
          Write-Host 'PI_EXISTING_LAUNCHER_AUDIT_EXECUTION=PASS'
      - name: No duplicate shortcut or service manipulation
        shell: powershell
        run: |
          $code = Get-Content 'scripts/pi-audit-existing-launcher.ps1' -Raw
          foreach ($needle in @('PI_DISCOVERY_MUTATION=NONE','CreateShortcut($file.FullName)',
            'Get-NetTCPConnection','Get-FileHash')) {
            if (-not $code.Contains($needle)) { throw ('PI_AUDITOR_REQUIRED_GUARD_MISSING: '+$needle) }
          }
          foreach ($forbidden in @('Start-Process','Stop-Process','Set-Content',
            'New-Item','Remove-Item','Save()','artisan migrate','composer install')) {
            if ($code.Contains($forbidden)) { throw ('PI_AUDITOR_MUTATION_FORBIDDEN: '+$forbidden) }
          }
          if (Test-Path 'scripts/pi-windows-app.ps1') {
            throw 'PI_DUPLICATE_WINDOWS_LAUNCHER_REINTRODUCED'
          }
          Write-Host 'PI_EXISTING_ICON_PRESERVED=PASS'
          Write-Host 'PI_NO_DUPLICATE_LAUNCHER=PASS'

      - name: Validate read-only R74 adapter audit against no listener
        shell: powershell
        run: |
          $candidate = 49397
          $occupied = Get-NetTCPConnection -LocalPort $candidate -State Listen -ErrorAction SilentlyContinue
          if ($occupied) { throw 'PI_CI_AUDIT_PORT_UNEXPECTEDLY_OCCUPIED' }
          $actual = & '.\scripts\pi-r74-ensure-runtime.ps1' -AppRoot $PWD.Path -Port $candidate -Mode Audit
          if ($actual -notcontains 'PI_R74_AUDIT_MUTATION=NONE' -or
              $actual -notcontains 'PI_R74_SERVER_ABSENT=YES') {
            throw 'PI_R74_READ_ONLY_AUDIT_FAILED'
          }
          Write-Host 'PI_R74_READ_ONLY_AUDIT=PASS'
      - name: Single origin and no destructive operator actions
        shell: powershell
        run: |
          $code = Get-Content 'scripts/pi-r74-ensure-runtime.ps1' -Raw
          foreach ($needle in @('Test-OwnedOrigin','Test-ExactAsset',
              'PI_R74_PROBE_HASH_OR_HEALTH_MISMATCH','PI_R74_START_LOCK_TIMEOUT',
              'PI_R74_AUDIT_MUTATION=NONE','--host=127.0.0.1')) {
            if (-not $code.Contains($needle)) { throw ('PI_R74_GUARD_MISSING: ' + $needle) }
          }
          foreach ($forbidden in @('migrate:fresh','migrate --force','db:wipe',
              'Remove-Item','Stop-Process','New-Service','Register-ScheduledTask',
              'CreateShortcut(', 'docker compose')) {
            if ($code.Contains($forbidden)) { throw ('PI_R74_UNSAFE_ACTION: ' + $forbidden) }
          }
          Write-Host 'PI_R74_SOURCE_ONLY_GUARDS=PASS'

      - name: Original R74 file preservation and in-place package guard
        shell: powershell
        run: |
          $installer = Get-Content 'scripts/pi-r74-inplace-upgrade.ps1' -Raw
          $hidden = Get-Content 'scripts/windows/r74/BUKA-PI-LARAVEL-HIDDEN.cmd' -Raw
          $manual = Get-Content 'scripts/windows/r74/BUKA-PI-LARAVEL.cmd' -Raw
          foreach ($needle in @('9FC0BF471E18','D59A6681D3A0','A0238A4B33E5',
              'PI_R74_UPGRADE=READ_ONLY_PREFLIGHT_PASS','-not $Apply',
              'ORIGINAL_SHA256.json','PI_R74_MAIN_DB_AND_ENV=UNTOUCHED')) {
            if (-not $installer.Contains($needle)) { throw ('PI_R74_INSTALL_GUARD_MISSING: ' + $needle) }
          }
          foreach ($needle in @('PI-R74-RUNTIME.ps1','-Port 8820 -Mode Ensure',
              '127.0.0.1:8820')) {
            if (-not $hidden.Contains($needle)) { throw ('PI_R74_ORIGINAL_CMD_UPGRADE_BAD: ' + $needle) }
          }
          if (-not $manual.Contains('BUKA-PI-LARAVEL-HIDDEN.cmd')) {
            throw 'PI_R74_MANUAL_LAUNCHER_HAS_SECOND_SERVER'
          }
          foreach ($forbidden in @('artisan migrate','migrate:fresh','db:wipe',
              'Stop-Process','New-Service','Register-ScheduledTask','CreateShortcut')) {
            if ($installer.Contains($forbidden) -or $hidden.Contains($forbidden) -or
                $manual.Contains($forbidden)) {
              throw ('PI_R74_UPGRADE_DESTRUCTIVE_ACTION: ' + $forbidden)
            }
          }
          Write-Host 'PI_R74_EXISTING_ICON_AND_8820=PINNED'
          Write-Host 'PI_R74_GUARDED_INPLACE_PACKAGE=PASS'
      - name: Fail closed on unavailable owner's original D drive
        shell: powershell
        run: |
          $errors = @()
          try {
            & '.\scripts\pi-r74-inplace-upgrade.ps1' -ErrorAction Stop
          } catch {
            $errors += [string]$_.Exception.Message
          }
          if ($errors.Count -ne 1 -or $errors[0] -notmatch 'PI_R74_ORIGINAL_LAUNCHER_NOT_FOUND') {
            throw 'PI_R74_MISSING_REAL_APP_DID_NOT_FAIL_CLOSED'
          }
          Write-Host 'PI_R74_NO_WINDOWS_OWNER_MUTATION=PASS'

      - name: R74 acceptance defaults to read-only and requires observed owner machine
        shell: powershell
        run: |
          $code = Get-Content 'scripts/pi-r74-windows-acceptance.ps1' -Raw
          foreach ($guard in @('PI_R74_ORIGINAL_BACKUP_MANIFEST=VERIFIED',
              'PI_R74_TWO_CMDS_AND_SUPERVISOR=EXACT_SOURCE_MATCH',
              'PI_R74_ACCEPTANCE=READ_ONLY_INSTALLED_INTEGRITY_PASS',
              'if (-not $ExerciseShortcut)',
              'PI_R74_DESKTOP_SHORTCUT_AND_VBS=UNCHANGED',
              'PI_R74_AFTER_SECOND_CLICK_SAME_PID=',
              'PI_R74_LOGIN_AND_RESTART_E2E=REQUIRES_USER_OBSERVATION')) {
            if (-not $code.Contains($guard)) {
              throw ('PI_R74_ACCEPTANCE_GUARD_MISSING: '+$guard)
            }
          }
          foreach ($bad in @('Stop-Process','artisan migrate','db:wipe',
              'Register-ScheduledTask','New-Service','.Save()','Save()')) {
            if ($code.Contains($bad)) { throw ('PI_R74_ACCEPTANCE_FORBIDDEN: ' + $bad) }
          }
          $errText = ''
          try {
            & '.\scripts\pi-r74-windows-acceptance.ps1' -ErrorAction Stop | Out-Null
          } catch {
            $errText = [string]$_.Exception.Message
          }
          if ($errText -notmatch 'PI_R74_EXISTING_LAUNCHER_FOLDER_MISSING') {
            throw 'PI_R74_ACCEPTANCE_UNEXPECTED_MUTATION_OR_STATE'
          }
          if (-not $code.Contains('CreateShortcut($ShortcutPath)')) {
            throw 'PI_R74_ORIGINAL_SHORTCUT_INSPECTION_MISSING'
          }
          Write-Host 'PI_R74_ACCEPTANCE_READ_ONLY_GUARDS=PASS'

      - name: PS5.1 original backup manifest roundtrip and tamper detection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP ('pi-r74-receipt-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $names = @('BUKA-PI-HIDDEN.vbs','BUKA-PI-LARAVEL-HIDDEN.cmd','BUKA-PI-LARAVEL.cmd')
          $expected = @{}
          $receipt = foreach ($name in $names) {
            $target = Join-Path $temp $name
            [IO.File]::WriteAllText($target, ('original-r74-fixture-' + $name))
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
            $expected[$name] = $hash.Substring(0,12)
            [pscustomobject]@{ File=$name; SHA256=$hash }
          }
          # Reproduce production installer's exact PS5.1 serialization.
          $receipt | ConvertTo-Json | Out-File -LiteralPath (Join-Path $temp 'ORIGINAL_SHA256.json') -Encoding UTF8
          $verified = @(& '.\scripts\pi-r74-verify-backup.ps1' -BackupRoot $temp -ExpectedSha12 $expected)
          if ($verified -notcontains 'PI_R74_ORIGINAL_BACKUP_MANIFEST=VERIFIED' -or
              @($verified | Where-Object { $_ -like 'PI_R74_BACKUP_FILE_VERIFIED=*' }).Count -ne 3) {
            throw 'PI_R74_RECEIPT_JSON_ROUNDTRIP_FAILED'
          }
          Write-Host 'PI_R74_RECEIPT_PS51_ROUNDTRIP=PASS'
          $tampered = Join-Path $temp $names[0]
          [IO.File]::AppendAllText($tampered, '-altered')
          $failure = ''
          try {
            & '.\scripts\pi-r74-verify-backup.ps1' -BackupRoot $temp -ExpectedSha12 $expected | Out-Null
          } catch {
            $failure = [string]$_.Exception.Message
          }
          if ($failure -notmatch 'PI_R74_BACKUP_FILE_FULL_HASH_MISMATCH') {
            throw 'PI_R74_TAMPERED_BACKUP_NOT_REJECTED'
          }
          Write-Host 'PI_R74_TAMPERED_BACKUP_FAIL_CLOSED=PASS'

      - name: R74 recurrent login read-only investigation guards
        shell: powershell
        run: |
          $script = Get-Content 'scripts/pi-r74-auth-runtime-diagnostic.ps1' -Raw
          $php = Get-Content 'scripts/pi-r74-auth-db-readonly.php' -Raw
          foreach ($needle in @('PI_R74_8820_PROCESS_USES_RECOVERED_APP_ROOT',
              'PI_R74_LARAVEL_CONFIG_CACHE_PRESENT',
              'PI_R74_ENV_DB_URL_OVERRIDE_PRESENT',
              'PI_R74_NO_ACCOUNT_PASSWORD_OR_DB_MUTATION=YES')) {
            if (-not $script.Contains($needle)) { throw ('PI_R74_AUTH_DIAG_MISSING: ' + $needle) }
          }
          foreach ($needle in @('SQLITE3_OPEN_READONLY','PI_R74_MATCHING_USERNAME_COUNT=',
              'PI_R74_DB_PROBE_READ_ONLY=YES','PI_R74_ACCOUNT_PASSWORD_SCHEME=')) {
            if (-not $php.Contains($needle)) { throw ('PI_R74_DB_DIAG_MISSING: ' + $needle) }
          }
          foreach ($forbidden in @('Stop-Process','Set-Content','Remove-Item',
              'Start-Process','artisan migrate','CreateShortcut(','Read-Host')) {
            if ($script.Contains($forbidden)) { throw ('PI_R74_AUTH_DIAG_MUTATION_FORBIDDEN: ' + $forbidden) }
          }
          foreach ($forbidden in @('SQLITE3_OPEN_READWRITE','Hash::make','->save(',
              'UPDATE users','DELETE FROM users')) {
            if ($php.Contains($forbidden)) { throw ('PI_R74_DB_PROBE_MUTATION_FORBIDDEN: ' + $forbidden) }
          }
          $errText = ''
          try {
            & '.\scripts\pi-r74-auth-runtime-diagnostic.ps1' -ErrorAction Stop | Out-Null
          } catch {
            $errText = [string]$_.Exception.Message
          }
          if ($errText -notmatch 'PI_R74_ORIGINAL_APP_OR_ENV_NOT_FOUND') {
            throw 'PI_R74_AUTH_DIAG_WRONG_NEGATIVE_GUARD'
          }
          Write-Host 'PI_R74_AUTH_DIAG_NO_OWNER_MUTATION=PASS'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3
          coverage: none
      - name: PHP readonly SQLite user inventory with temporary CI fixture
        shell: powershell
        run: |
          $phpExe = (Get-Command php.exe -ErrorAction SilentlyContinue)
          if (-not $phpExe) { throw 'PHP_CLI_NOT_PRESENT_ON_WINDOWS_RUNNER' }
          & $phpExe.Source -l '.\scripts\pi-r74-auth-db-readonly.php'
          if ($LASTEXITCODE -ne 0) { throw 'PI_R74_AUTH_DB_PHP_LINT_FAILED' }
          if ((& $phpExe.Source -m) -notcontains 'sqlite3') {
            throw 'PHP_SQLITE3_EXTENSION_MISSING'
          }
          $dir = Join-Path $env:RUNNER_TEMP ('pi-auth-fixture-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir | Out-Null
          $dbFile = Join-Path $dir 'readonly.sqlite'
          $fixture = Join-Path $dir 'create-fixture.php'
          $code = @'
          <?php
          $db = new SQLite3($argv[1], SQLITE3_OPEN_READWRITE | SQLITE3_OPEN_CREATE);
          $db->exec("CREATE TABLE users (username TEXT, tenant_id TEXT, role TEXT, password TEXT)");
          $stmt = $db->prepare("INSERT INTO users VALUES (:u,:t,:r,:p)");
          $stmt->bindValue(":u", "test.institution", SQLITE3_TEXT);
          $stmt->bindValue(":t", "ID-DIY-YOG", SQLITE3_TEXT);
          $stmt->bindValue(":r", "institution_admin", SQLITE3_TEXT);
          $stmt->bindValue(":p", password_hash("fake-fixture-password-only", PASSWORD_BCRYPT), SQLITE3_TEXT);
          if (!$stmt->execute()) { exit(3); }
          $db->close();
          '@
          [IO.File]::WriteAllText($fixture, $code)
          & $phpExe.Source $fixture $dbFile
          if ($LASTEXITCODE -ne 0) { throw 'PI_R74_AUTH_CI_FIXTURE_SETUP_FAILED' }
          $before = (Get-FileHash -LiteralPath $dbFile -Algorithm SHA256).Hash
          $result = @(& $phpExe.Source '.\scripts\pi-r74-auth-db-readonly.php' $dbFile 'test.institution')
          if ($LASTEXITCODE -ne 0 -or
              $result -notcontains 'PI_R74_MATCHING_USERNAME_COUNT=1' -or
              $result -notcontains 'PI_R74_DB_PROBE_READ_ONLY=YES' -or
              $result -notcontains 'PI_R74_ACCOUNT_TENANT_EXPECTED=YES' -or
              $result -notcontains 'PI_R74_ACCOUNT_ROLE_EXPECTED=YES') {
            throw ('PI_R74_AUTH_DB_PROBE_FIXTURE_FAILED: ' + ($result -join ' | '))
          }
          $after = (Get-FileHash -LiteralPath $dbFile -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'PI_R74_AUTH_DB_PROBE_MUTATED_FIXTURE' }
          Write-Host 'PI_R74_AUTH_SQLITE_READ_ONLY=PASS'

      - name: R74 bcrypt parity verifies typed password without SQLite writes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $passwordProbe = Get-Content 'scripts/pi-r74-verify-entered-password.php' -Raw
          $wrapper = Get-Content 'scripts/pi-r74-credential-parity-local.ps1' -Raw
          foreach ($needle in @('SQLITE3_OPEN_READONLY','password_verify',
              'PI_R74_ENTERED_PASSWORD_MATCHES_RECOVERED_ACCOUNT=')) {
            if (-not $passwordProbe.Contains($needle)) { throw ('PI_R74_BCRYPT_SOURCE_GUARD_MISSING=' + $needle) }
          }
          foreach ($needle in @('Read-Host','-AsSecureString','ZeroFreeBSTR',
              'RedirectStandardInput = $true','StandardInput.BaseStream','GetBytes($plain)',
              'PI_R74_CREDENTIAL_PARITY=LOCAL_READ_ONLY')) {
            if (-not $wrapper.Contains($needle)) { throw ('PI_R74_SECURE_PROMPT_GUARD_MISSING=' + $needle) }
          }
          foreach ($bad in @('UPDATE users','DELETE FROM users','SQLITE3_OPEN_READWRITE',
              'password_hash(', 'file_put_contents(', '->save(')) {
            if ($passwordProbe.Contains($bad)) { throw ('PI_R74_BCRYPT_PROBE_MUTATION_FORBIDDEN=' + $bad) }
          }
          foreach ($bad in @('Start-Process','Stop-Process','Set-Content',
              'Register-ScheduledTask','artisan migrate')) {
            if ($wrapper.Contains($bad)) { throw ('PI_R74_SECURE_WRAPPER_MUTATION_FORBIDDEN=' + $bad) }
          }
          & php -l 'scripts/pi-r74-verify-entered-password.php'
          if ($LASTEXITCODE -ne 0) { throw 'PI_R74_BCRYPT_PHP_LINT_FAILED' }
          $tempDir=Join-Path $env:RUNNER_TEMP ('pi-r74-pass-fixture-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          $dbPath=Join-Path $tempDir 'fixture.sqlite'
          $fixturePhp=Join-Path $tempDir 'fixture.php'
          $fixtureCode=@'
          <?php
          $db=new SQLite3($argv[1], SQLITE3_OPEN_READWRITE | SQLITE3_OPEN_CREATE);
          $db->exec("CREATE TABLE users(username TEXT,tenant_id TEXT,role TEXT,password TEXT)");
          $q=$db->prepare("INSERT INTO users VALUES (:u,:t,:r,:p)");
          $q->bindValue(":u","qa-only.fixture",SQLITE3_TEXT);
          $q->bindValue(":t","ID-DIY-YOG",SQLITE3_TEXT);
          $q->bindValue(":r","institution_admin",SQLITE3_TEXT);
          $q->bindValue(":p",password_hash("ci-password-not-real",PASSWORD_BCRYPT),SQLITE3_TEXT);
          if (!$q->execute()) {exit(2);}
          $db->close();
          '@
          [IO.File]::WriteAllText($fixturePhp,$fixtureCode)
          & php $fixturePhp $dbPath
          if ($LASTEXITCODE -ne 0) { throw 'PI_R74_BCRYPT_FIXTURE_SETUP_FAILED' }
          $hashBefore=(Get-FileHash -LiteralPath $dbPath -Algorithm SHA256).Hash
          function Invoke-FixturePassword([string]$candidate,[string]$targetScript='scripts/pi-r74-verify-entered-password.php') {
            $info=New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName=(Get-Command php.exe).Source
            $info.Arguments=('"{0}" "{1}" "qa-only.fixture"' -f $targetScript,$dbPath)
            $info.UseShellExecute=$false
            $info.CreateNoWindow=$true
            $info.RedirectStandardInput=$true
            $info.RedirectStandardOutput=$true
            $info.RedirectStandardError=$true
            $child=New-Object System.Diagnostics.Process
            $child.StartInfo=$info
            try {
              if (-not $child.Start()) {throw 'PI_R74_FIXTURE_PHP_START_FAILED'}
              $payload=[System.Text.UTF8Encoding]::new($false).GetBytes($candidate)
              $raw=$child.StandardInput.BaseStream
              $raw.Write($payload,0,$payload.Length)
              $raw.Flush()
              $raw.Close()
              [Array]::Clear($payload,0,$payload.Length)
              $output=$child.StandardOutput.ReadToEnd()
              $null=$child.StandardError.ReadToEnd()
              $child.WaitForExit()
              if ($child.ExitCode -ne 0) {throw 'PI_R74_FIXTURE_PHP_EXIT_ERROR'}
              return @($output -split '\r?\n' | Where-Object { $_ -ne '' })
            } finally { $child.Dispose() }
          }
          # Test fixture-only transport bytes without touching any real secret.
          $peek=Join-Path $tempDir 'stdin-inspect-ci-only.php'
          [IO.File]::WriteAllText($peek,'<?php echo bin2hex(stream_get_contents(STDIN));')
          $actualHex=((@(Invoke-FixturePassword 'ci-password-not-real' $peek)) -join '').Trim()
          $expectedHex=[BitConverter]::ToString([Text.Encoding]::UTF8.GetBytes('ci-password-not-real')).Replace('-','').ToLowerInvariant()
          if ($actualHex -cne $expectedHex -and $actualHex -cne ('efbbbf'+$expectedHex)) {
            throw ('PI_R74_CI_STDIN_BYTES_UNEXPECTED_EXPECTED='+$expectedHex.Length+',ACTUAL='+$actualHex.Length)
          }
          if ($actualHex.StartsWith('efbbbf')) {
            Write-Host 'PI_R74_CI_WINDOWS_STDIN_UTF8_BOM=DETECTED'
          } else {
            Write-Host 'PI_R74_CI_WINDOWS_STDIN_UTF8_BOM=ABSENT'
          }
          Write-Host 'PI_R74_CI_TRANSPORT_BYTES_CLASSIFIED=PASS'
          # Verify the fixture hash directly without using transport code.
          $direct=Join-Path $tempDir 'direct-check-ci-only.php'
          [IO.File]::WriteAllText($direct,'<?php $db=new SQLite3($argv[1],SQLITE3_OPEN_READONLY);$hash=$db->querySingle("SELECT password FROM users LIMIT 1");echo password_verify("ci-password-not-real",$hash) ? "MATCH" : "NO_MATCH";')
          $fixtureParity=(& php $direct $dbPath)
          if ($fixtureParity -ne 'MATCH') {throw 'PI_R74_TEST_FIXTURE_BCRYPT_HASH_MISMATCH'}
          Write-Host 'PI_R74_CI_DIRECT_BCRYPT_FIXTURE=PASS'
          $yes=@(Invoke-FixturePassword 'ci-password-not-real')
          if ($yes -notcontains 'PI_R74_ENTERED_PASSWORD_MATCHES_RECOVERED_ACCOUNT=YES') {
            throw ('PI_R74_BCRYPT_PARITY_POSITIVE_FAILED: '+($yes -join '|'))
          }
          $no=@(Invoke-FixturePassword 'wrong-ci-only')
          if ($no -notcontains 'PI_R74_ENTERED_PASSWORD_MATCHES_RECOVERED_ACCOUNT=NO') {
            throw ('PI_R74_BCRYPT_PARITY_NEGATIVE_FAILED: '+($no -join '|'))
          }
          # Reproduce R87 recovery potential: historical pipeline may have
          # hashed UTF8 BOM + visibly correct password. Do not mutate main DB.
          $bomDb=Join-Path $tempDir 'bom-prefixed-fixture.sqlite'
          $bomFixture=Join-Path $tempDir 'bom-fixture.php'
          $bomCode=$fixtureCode.Replace(
            'password_hash("ci-password-not-real",PASSWORD_BCRYPT)',
            'password_hash("\xEF\xBB\xBFci-password-not-real",PASSWORD_BCRYPT)'
          )
          if ($bomCode -ceq $fixtureCode) { throw 'PI_R74_BOM_FIXTURE_NOT_REWRITTEN' }
          [IO.File]::WriteAllText($bomFixture,$bomCode)
          & php $bomFixture $bomDb
          if ($LASTEXITCODE -ne 0) { throw 'PI_R74_BOM_FIXTURE_SETUP_FAILED' }
          $savedDb=$dbPath
          try {
            $dbPath=$bomDb
            $bomCheck=@(Invoke-FixturePassword 'ci-password-not-real')
            if ($bomCheck -notcontains 'PI_R74_ENTERED_PASSWORD_MATCHES_RECOVERED_ACCOUNT=NO' -or
                $bomCheck -notcontains 'PI_R74_R87_RECOVERY_BOM_PREFIX_MATCH=YES') {
              throw ('PI_R74_BOM_RECOVERY_DETECTION_FAILED: '+($bomCheck -join '|'))
            }
          } finally {
            $dbPath=$savedDb
          }
          Write-Host 'PI_R74_R87_BOM_PREFIX_DETECTION_FIXTURE=PASS'
          $hashAfter=(Get-FileHash -LiteralPath $dbPath -Algorithm SHA256).Hash
          if ($hashBefore -ne $hashAfter) { throw 'PI_R74_BCRYPT_READONLY_DB_CHANGED' }
          Write-Host 'PI_R74_BCRYPT_PARITY_POSITIVE=PASS'
          Write-Host 'PI_R74_BCRYPT_PARITY_NEGATIVE=PASS'
          Write-Host 'PI_R74_BCRYPT_READONLY_DB_IMMUTABLE=PASS'

