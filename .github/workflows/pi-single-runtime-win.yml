name: PI existing unified launcher audit safety
on:
  pull_request:
    paths:
      - 'scripts/pi-audit-existing-launcher.ps1'
      - 'scripts/pi-r74-ensure-runtime.ps1'
      - 'scripts/pi-r74-inplace-upgrade.ps1'
      - 'scripts/pi-r74-windows-acceptance.ps1'
      - 'scripts/windows/r74/**'
      - 'docs/PI_R74_ONE_ORIGIN_RUNTIME_ADAPTER_20261122.md'
      - 'docs/PI_SINGLE_RUNTIME_MANDATE_20261122.md'
      - '.github/workflows/pi-single-runtime-win.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-audit-existing-launcher.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_EXISTING_LAUNCHER_AUDIT_PARSE_FAILURE'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-ensure-runtime.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_RUNTIME_ADAPTER_PARSE_FAILURE'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-inplace-upgrade.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_INPLACE_UPGRADE_PARSE_FAILURE'
          }
          Write-Host 'PI_EXISTING_LAUNCHER_AUDIT_PARSE=PASS'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pi-r74-windows-acceptance.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'PI_R74_ACCEPTANCE_PARSE_FAILURE'
          }
          Write-Host 'PI_R74_INPLACE_UPGRADE_PARSE=PASS'
          Write-Host 'PI_R74_ACCEPTANCE_PARSE=PASS'
      - name: Run read-only inventory on clean runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\pi-audit-existing-launcher.ps1'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw 'PI_AUDITOR_EXECUTION_FAILED'
          }
          Write-Host 'PI_EXISTING_LAUNCHER_AUDIT_EXECUTION=PASS'
      - name: No duplicate shortcut or service manipulation
        shell: powershell
        run: |
          $code = Get-Content 'scripts/pi-audit-existing-launcher.ps1' -Raw
          foreach ($needle in @('PI_DISCOVERY_MUTATION=NONE','CreateShortcut($file.FullName)',
            'Get-NetTCPConnection','Get-FileHash')) {
            if (-not $code.Contains($needle)) { throw ('PI_AUDITOR_REQUIRED_GUARD_MISSING: '+$needle) }
          }
          foreach ($forbidden in @('Start-Process','Stop-Process','Set-Content',
            'New-Item','Remove-Item','Save()','artisan migrate','composer install')) {
            if ($code.Contains($forbidden)) { throw ('PI_AUDITOR_MUTATION_FORBIDDEN: '+$forbidden) }
          }
          if (Test-Path 'scripts/pi-windows-app.ps1') {
            throw 'PI_DUPLICATE_WINDOWS_LAUNCHER_REINTRODUCED'
          }
          Write-Host 'PI_EXISTING_ICON_PRESERVED=PASS'
          Write-Host 'PI_NO_DUPLICATE_LAUNCHER=PASS'

      - name: Validate read-only R74 adapter audit against no listener
        shell: powershell
        run: |
          $candidate = 49397
          $occupied = Get-NetTCPConnection -LocalPort $candidate -State Listen -ErrorAction SilentlyContinue
          if ($occupied) { throw 'PI_CI_AUDIT_PORT_UNEXPECTEDLY_OCCUPIED' }
          $actual = & '.\scripts\pi-r74-ensure-runtime.ps1' -AppRoot $PWD.Path -Port $candidate -Mode Audit
          if ($actual -notcontains 'PI_R74_AUDIT_MUTATION=NONE' -or
              $actual -notcontains 'PI_R74_SERVER_ABSENT=YES') {
            throw 'PI_R74_READ_ONLY_AUDIT_FAILED'
          }
          Write-Host 'PI_R74_READ_ONLY_AUDIT=PASS'
      - name: Single origin and no destructive operator actions
        shell: powershell
        run: |
          $code = Get-Content 'scripts/pi-r74-ensure-runtime.ps1' -Raw
          foreach ($needle in @('Test-OwnedOrigin','Test-ExactAsset',
              'PI_R74_PROBE_HASH_OR_HEALTH_MISMATCH','PI_R74_START_LOCK_TIMEOUT',
              'PI_R74_AUDIT_MUTATION=NONE','--host=127.0.0.1')) {
            if (-not $code.Contains($needle)) { throw ('PI_R74_GUARD_MISSING: ' + $needle) }
          }
          foreach ($forbidden in @('migrate:fresh','migrate --force','db:wipe',
              'Remove-Item','Stop-Process','New-Service','Register-ScheduledTask',
              'CreateShortcut(', 'docker compose')) {
            if ($code.Contains($forbidden)) { throw ('PI_R74_UNSAFE_ACTION: ' + $forbidden) }
          }
          Write-Host 'PI_R74_SOURCE_ONLY_GUARDS=PASS'

      - name: Original R74 file preservation and in-place package guard
        shell: powershell
        run: |
          $installer = Get-Content 'scripts/pi-r74-inplace-upgrade.ps1' -Raw
          $hidden = Get-Content 'scripts/windows/r74/BUKA-PI-LARAVEL-HIDDEN.cmd' -Raw
          $manual = Get-Content 'scripts/windows/r74/BUKA-PI-LARAVEL.cmd' -Raw
          foreach ($needle in @('9FC0BF471E18','D59A6681D3A0','A0238A4B33E5',
              'PI_R74_UPGRADE=READ_ONLY_PREFLIGHT_PASS','-not $Apply',
              'ORIGINAL_SHA256.json','PI_R74_MAIN_DB_AND_ENV=UNTOUCHED')) {
            if (-not $installer.Contains($needle)) { throw ('PI_R74_INSTALL_GUARD_MISSING: ' + $needle) }
          }
          foreach ($needle in @('PI-R74-RUNTIME.ps1','-Port 8820 -Mode Ensure',
              '127.0.0.1:8820')) {
            if (-not $hidden.Contains($needle)) { throw ('PI_R74_ORIGINAL_CMD_UPGRADE_BAD: ' + $needle) }
          }
          if (-not $manual.Contains('BUKA-PI-LARAVEL-HIDDEN.cmd')) {
            throw 'PI_R74_MANUAL_LAUNCHER_HAS_SECOND_SERVER'
          }
          foreach ($forbidden in @('artisan migrate','migrate:fresh','db:wipe',
              'Stop-Process','New-Service','Register-ScheduledTask','CreateShortcut')) {
            if ($installer.Contains($forbidden) -or $hidden.Contains($forbidden) -or
                $manual.Contains($forbidden)) {
              throw ('PI_R74_UPGRADE_DESTRUCTIVE_ACTION: ' + $forbidden)
            }
          }
          Write-Host 'PI_R74_EXISTING_ICON_AND_8820=PINNED'
          Write-Host 'PI_R74_GUARDED_INPLACE_PACKAGE=PASS'
      - name: Fail closed on unavailable owner's original D drive
        shell: powershell
        run: |
          $errors = @()
          try {
            & '.\scripts\pi-r74-inplace-upgrade.ps1' -ErrorAction Stop
          } catch {
            $errors += [string]$_.Exception.Message
          }
          if ($errors.Count -ne 1 -or $errors[0] -notmatch 'PI_R74_ORIGINAL_LAUNCHER_NOT_FOUND') {
            throw 'PI_R74_MISSING_REAL_APP_DID_NOT_FAIL_CLOSED'
          }
          Write-Host 'PI_R74_NO_WINDOWS_OWNER_MUTATION=PASS'

      - name: R74 acceptance defaults to read-only and requires observed owner machine
        shell: powershell
        run: |
          $code = Get-Content 'scripts/pi-r74-windows-acceptance.ps1' -Raw
          foreach ($guard in @('PI_R74_ORIGINAL_BACKUP_MANIFEST=VERIFIED',
              'PI_R74_TWO_CMDS_AND_SUPERVISOR=EXACT_SOURCE_MATCH',
              'PI_R74_ACCEPTANCE=READ_ONLY_INSTALLED_INTEGRITY_PASS',
              'if (-not $ExerciseShortcut)',
              'PI_R74_DESKTOP_SHORTCUT_AND_VBS=UNCHANGED',
              'PI_R74_AFTER_SECOND_CLICK_SAME_PID=',
              'PI_R74_LOGIN_AND_RESTART_E2E=REQUIRES_USER_OBSERVATION')) {
            if (-not $code.Contains($guard)) {
              throw ('PI_R74_ACCEPTANCE_GUARD_MISSING: '+$guard)
            }
          }
          foreach ($bad in @('Stop-Process','artisan migrate','db:wipe',
              'Register-ScheduledTask','New-Service','.Save()','Save()')) {
            if ($code.Contains($bad)) { throw ('PI_R74_ACCEPTANCE_FORBIDDEN: ' + $bad) }
          }
          $errText = ''
          try {
            & '.\scripts\pi-r74-windows-acceptance.ps1' -ErrorAction Stop | Out-Null
          } catch {
            $errText = [string]$_.Exception.Message
          }
          if ($errText -notmatch 'PI_R74_EXISTING_LAUNCHER_FOLDER_MISSING') {
            throw 'PI_R74_ACCEPTANCE_UNEXPECTED_MUTATION_OR_STATE'
          }
          if (-not $code.Contains('CreateShortcut($ShortcutPath)')) {
            throw 'PI_R74_ORIGINAL_SHORTCUT_INSPECTION_MISSING'
          }
          Write-Host 'PI_R74_ACCEPTANCE_READ_ONLY_GUARDS=PASS'
