              # OEM-mojibake strings from native PowerShell git stdout.
              $info=New-Object System.Diagnostics.ProcessStartInfo
              $info.FileName=(Get-Command git.exe -ErrorAction Stop).Source
              $info.Arguments='-C "'+$sourceRoot+'" show "'+$base+':'+$gitPath+'"'
              $info.UseShellExecute=$false
              $info.RedirectStandardOutput=$true
              $info.CreateNoWindow=$true
              $process=[Diagnostics.Process]::Start($info)
              $output=[IO.File]::Open($target,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write)
              try {
                $process.StandardOutput.BaseStream.CopyTo($output)
                $process.WaitForExit()
                if($process.ExitCode -ne 0 -or $output.Length -eq 0) {
                  throw ('PI_R100_CI_RAW_BASELINE_BYTES_NOT_FOUND='+$rel)
