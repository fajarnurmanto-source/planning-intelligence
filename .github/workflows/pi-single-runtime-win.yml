          if ((Get-FileHash $fixture.Html -Algorithm SHA256).Hash -ne $fixture.HtmlBefore -or
              (Get-FileHash $fixture.Js -Algorithm SHA256).Hash -ne $fixture.JsBefore) {
            throw 'PI_R74_CI_PREFLIGHT_MUTATED_FILES'
          }
          $applied=@(& $installer -Apply -CiFixtureRoot $fixture.Base -CiHtmlBaselineBlob $fixture.HtmlBlob -CiJsBaselineBlob $fixture.JsBlob)
