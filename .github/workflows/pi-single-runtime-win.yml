          if ($driftFail -notmatch 'PI_R74_LOGIN_ORIGINAL_SOURCE_DRIFT=login.html_STOP' -or
              (Get-FileHash $drift.Html -Algorithm SHA256).Hash -ne $driftHash -or
              (Test-Path (Join-Path $drift.Launcher 'backups'))) {
            throw 'PI_R74_REAL_INSTALLER_CI_DRIFT_DID_NOT_FAIL_CLOSED'
          }
          Write-Host 'PI_R74_REAL_INSTALLER_WINDOWS_DRIFT_HOLD=PASS'
