name: PI VS2 reviewer workspace (synthetic)
on:
  pull_request:
    branches:
      - feat/pi-document-coherence-vs1
      - v0.1-provenance-ingestion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing PI dependencies + off-the-shelf UI
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "gradio>=5,<7" "pytest>=8,<10"
      - name: Regression + user workflow tests
        working-directory: backend
        run: python -m pytest -q tests/test_coherence_vs1.py tests/test_review_vs2.py
